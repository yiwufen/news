services:
  app:
    build: .
    container_name: knowledge-retrieval
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5-community
    container_name: knowledge-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-test1234}
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-test1234} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j-data:
  neo4j-logs:
