services:
  # ====================================================================
  # Caddy — public-facing reverse proxy with auto HTTPS
  # ====================================================================
  caddy:
    image: caddy:2-alpine
    container_name: knowledge-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - NO_PROXY=mcp,neo4j,caddy,localhost,127.0.0.1,172.18.0.0/16,172.17.0.0/16
      - no_proxy=mcp,neo4j,caddy,localhost,127.0.0.1,172.18.0.0/16,172.17.0.0/16
      - HTTP_PROXY=
      - http_proxy=
      - HTTPS_PROXY=
      - https_proxy=
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - knowledge-net
    depends_on:
      - mcp

  # ====================================================================
  # MCP Server — stateless Streamable HTTP API
  # ====================================================================
  mcp:
    build: .
    container_name: knowledge-mcp
    restart: unless-stopped
    env_file: /home/deployer/knowledge/.env
    volumes:
      - /home/deployer/knowledge/data:/app/data
    networks:
      - knowledge-net
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      # 自适应健康检查：同一镜像既作为常驻 MCP 服务（监听 8000），也作为
      # ``docker compose run --rm`` 起的离线 ingestion 容器（不监听端口、
      # 仅循环写日志）。脚本 healthcheck.py 对两类角色分别判定。
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ====================================================================
  # Admin Dashboard — read-only monitoring and data browsing
  # ====================================================================
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: knowledge-admin
    restart: unless-stopped
    env_file: /home/deployer/knowledge/.env
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - JWT_SECRET=${JWT_SECRET:-}
    volumes:
      - /home/deployer/knowledge/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - knowledge-net
    depends_on:
      - mcp
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost',8001)); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ====================================================================
  # Neo4j — graph database (internal network only, no public ports)
  # ====================================================================
  neo4j:
    image: neo4j:5-community
    container_name: knowledge-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-test1234}
      # Cap JVM memory on small (≤4G) hosts. Without these Neo4j's default
      # heuristic pre-reserves a large heap + page cache that never returns
      # to the OS, pushing the whole box into global OOM (exit 137).
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - knowledge-net
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-test1234} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ====================================================================
  # Cloudflare Tunnel — outbound-only public ingress (no inbound ports).
  # Token 由 Cloudflare Zero Trust 面板创建隧道时提供，经
  # /home/deployer/knowledge/.env 的 TUNNEL_TOKEN 注入，不进 git。
  # ====================================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: knowledge-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: /home/deployer/knowledge/.env
    networks:
      - knowledge-net
    depends_on:
      - caddy

# ====================================================================
# Networks
# ====================================================================
networks:
  knowledge-net:
    driver: bridge

# ====================================================================
# Volumes
# ====================================================================
volumes:
  caddy-data:
  caddy-config:
  neo4j-data:
  neo4j-logs:
