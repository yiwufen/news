[project]
name = "news-collector"
version = "0.1.0"
description = "Financial knowledge retrieval CLI service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.88.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.2.2",
    "neo4j>=5.0.0",
    "python-dateutil>=2.9.0.post0",
    "httpx>=0.28.0",
    "numpy>=1.26.0",
    "faiss-cpu>=1.9.0",
    "jieba>=0.42.1",
    "pyahocorasick>=2.3.1",
]

[project.scripts]
knowledge-cli = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "collectors"]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
tmp_path_retention_policy = "failed"
testpaths = ["tests"]
norecursedirs = [
    ".tmp",
    ".pytest-tmp",
    "tmp_pytest",
    "tmp*",
    "pytest-cache-files-*",
    "codex-pytest-temp",
    "codex_pytest_review_*",
    "codex-pytest-review-*",
    "codex-manual-check",
    "codex-manual-check-pipeline",
]
