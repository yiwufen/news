[project]
name = "news-collector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.88.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "neo4j>=5.0.0",
    "langgraph>=0.2.0",
    "python-dateutil>=2.9.0.post0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.0.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.28.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
tmp_path_retention_policy = "failed"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = [
    ".tmp",
    ".pytest-tmp",
    "tmp_pytest",
    "tmp*",
    "pytest-cache-files-*",
    "codex-pytest-temp",
    "codex_pytest_review_*",
    "codex-pytest-review-*",
    "codex-manual-check",
    "codex-manual-check-pipeline",
]
